{% extends "base.html" %}
{% block title %}Админ-панель — WMS{% endblock %}
{% block content %}
<h2>Панель администратора</h2>
<p class="subtitle">Управление системой</p>

<div style="display:flex; gap:20px; margin:20px 0;">
    <div style="flex:1; background:#f3f4f6; padding:20px; border-radius:8px; text-align:center;">
        <h3 style="margin:0; font-size:2rem; color:#1e3a8a;">{{ users_count }}</h3>
        <p style="margin:5px 0 0 0; color:#555;">Пользователей</p>
    </div>
    <div style="flex:1; background:#f3f4f6; padding:20px; border-radius:8px; text-align:center;">
        <h3 style="margin:0; font-size:2rem; color:#1e3a8a;">{{ products_count }}</h3>
        <p style="margin:5px 0 0 0; color:#555;">Товаров</p>
    </div>
</div>

<div class="nav-menu" style="flex-direction:column;">
    <a href="/admin/users" class="nav-btn">👥 Управление пользователями</a>
    <a href="/admin/products" class="nav-btn">📦 Управление товарами</a>
</div>

<p class="switch" style="margin-top:30px;"><a href="/dashboard">← Вернуться на главную</a></p>
{% endblock %}
